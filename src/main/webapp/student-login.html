
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Portal | Attendance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container" style="max-width:520px">
    <h1>Student Portal</h1>
    <p>Sign in to view your attendance and academic reports.</p>

    <div class="dashboard-links">
        <a href="#" id="loginTab">Sign In</a>
        <a href="#" id="registerTab">Create Account</a>
    </div>

    <form id="studentForm">
        <div id="rollField" hidden>
            <label for="rollNumber">Roll Number</label>
            <input id="rollNumber" name="rollNumber"
                   autocomplete="off">
        </div>

        <label for="email">Student Email</label>
        <input id="email" name="email" type="email"
               autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               minlength="8" autocomplete="current-password" required>

        <button id="submitButton" type="submit">Sign In</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="login.html">Admin login</a></p>
</main>
<script src="js/student-login.js"></script>
</body>
</html>
